name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  # IDs del proyecto en Vercel. No son secretos (sin VERCEL_TOKEN no sirven de nada),
  # así que van en claro para no tener que configurar dos secrets más.
  VERCEL_ORG_ID: team_3DUaoBXJoYRInk75ggr2PtDx
  VERCEL_PROJECT_ID: prj_rtkLNg3dwtHa5lfCfNd4jXwAdC1q

jobs:
  deploy:
    name: Build y deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar que los secrets están configurados
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets en el repositorio:$missing"
            echo "Configúralos en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Determinar entorno de despliegue
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar configuración del proyecto de Vercel
        run: |
          vercel pull --yes \
            --environment=${{ steps.target.outputs.environment }} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # Aquí está el punto de la historia: los secretos viven en GitHub y se
      # materializan como .env justo antes del build. Next.js carga
      # .env.production.local con la máxima prioridad entre los ficheros .env,
      # así que estos valores son los que quedan inlineados en el bundle.
      - name: Generar .env.production.local desde los secrets del repositorio
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          } > .env.production.local
          echo "Generado .env.production.local con $(wc -l < .env.production.local) variables"

      - name: Build (frontend + rutas de servidor)
        run: vercel build ${{ steps.target.outputs.flag }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} \
            --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url"

      - name: Comprobar que el despliegue responde
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/health")
            [ "$code" = "200" ] && echo "Health check OK" && exit 0
            echo "Intento $i: HTTP $code, reintentando…"
            sleep 5
          done
          echo "::error::El health check no devolvió 200"
          exit 1

      - name: Resumen
        run: |
          {
            echo "### Despliegue ${{ steps.target.outputs.environment }}"
            echo ""
            echo "URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar la URL de preview en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.number }}" --body "Preview desplegada: ${{ steps.deploy.outputs.url }}"
