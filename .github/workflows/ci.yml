name: CI

# The quality gate for /next. GitHub runs it, not the agent: an agent that says
# "lint passed" is a promise, a green check is a fact.
# No secrets needed — `npm run build` works without environment variables.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: format
        run: npm run format

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
