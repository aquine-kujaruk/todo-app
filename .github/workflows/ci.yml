name: CI

# La puerta de calidad de /next. La corre GitHub, no el agente: un modelo que
# dice "el lint pasó" es una promesa, un check verde es un hecho.
# No necesita ningún secret — `npm run build` funciona sin variables de entorno.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
